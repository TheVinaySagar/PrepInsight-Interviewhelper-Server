name: Deploy AWS Lambda

on:
  push:
    branches:
      - test  # Triggers workflow on push to the "test" branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install
        working-directory: server  # Ensure the command runs inside /server

      # - name: Build the project (if applicable)
      #   run: npm run build
      #   working-directory: server

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Package for Lambda
        run: |
          cd server
          zip -r deploy.zip .  # Ensure the zip file is created inside /server

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code --function-name interviewsite --zip-file fileb://server/deploy.zip
