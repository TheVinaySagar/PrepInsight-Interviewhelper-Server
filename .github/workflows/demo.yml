name: AwsLambdaWorkflow

on:
  push:
    branches: ["test"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20.x'  # Change to a valid version

      - name: Install dependencies
        run: npm ci

      - name: Build the project (if applicable)
        run: npm run build # Remove if not needed

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1  # AWS region

      - name: Package for Lambda
        run: zip -r deploy.zip .  # Ensure all files, including node_modules, are included

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code --function-name=interviewsite --zip-file=fileb://deploy.zip
