name: Deploy AWS Lambda

on:
  push:
    branches:
      - test  # Triggers workflow on push to the "test" branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install
        working-directory: server  # Ensure the command runs inside /server

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
          
      - name: Package for Lambda
        run: |
          cd server
          zip -r deploy.zip .

      - name: Upload ZIP to S3
        run: |
          aws s3 cp server/deploy.zip s3://bucket-vinay1/deploy.zip

      - name: Deploy to AWS Lambda from S3
        run: |
          aws lambda update-function-code --function-name interviewsite --s3-bucket bucket-vinay1 --s3-key deploy.zip
